  </g>
  
  <!-- 核心圆环 - 多层防御 -->
  <circle cx="160" cy="160" r="52" stroke="currentColor" stroke-width="10" fill="none"/>
  <circle cx="160" cy="160" r="28" fill="currentColor"/>
</svg>
