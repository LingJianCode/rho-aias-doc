    <path d="M228 35 Q268 75, 242 138 Q215 178, 202 172 Q195 165, 218 125 Q250 78, 228 35Z" opacity="0.92"/>
    <!-- 花瓣 3 - 右 -->
    <path d="M282 105 Q298 160, 258 208 Q218 240, 205 230 Q198 222, 228 192 Q268 152, 282 105Z" opacity="0.84"/>
    <!-- 花瓣 4 - 右下 -->
    <path d="M298 185 Q290 240, 238 268 Q192 290, 180 278 Q175 270, 212 255 Q268 228, 298 185Z" opacity="0.76"/>
    <!-- 花瓣 5 - 左下 -->
    <path d="M255 275 Q208 308, 148 298 Q102 290, 100 275 Q102 267, 145 272 Q208 278, 255 275Z" opacity="0.68"/>
    <!-- 花瓣 6 - 左 -->
    <path d="M148 308 Q88 305, 52 252 Q28 208, 42 195 Q52 190, 88 225 Q138 272, 148 308Z" opacity="0.6"/>
    <!-- 花瓣 7 - 左上 -->
